name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate-pacman-game-from-github-contribution-grid
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_token: ${{ secrets.PAC_TOKEN }}
          games: pacman
          player_style: opportunistic
